# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0
  # maxInstances: 100
  # concurrency: 80
  # cpu: 1
  # memoryMiB: 512

scripts:
  buildCommand: npm run build
  runCommand: node server/index.js

# Environment variables and secrets.
# env:
  # Configure environment variables.
  # See https://firebase.google.com/docs/app-hosting/configure#user-defined-environment
  # - variable: MESSAGE
  #   value: Hello world!
  #   availability:
  #     - BUILD
  #     - RUNTIME

  # Grant access to secrets in Cloud Secret Manager.
  # You can create secrets with the CLI command `firebase apphosting:secrets:set <secretName>`.
  # See https://firebase.google.com/docs/app-hosting/configure#secret-parameters
  # - variable: MY_SECRET
  #   secret: mySecretRef


env: 
- variable: CODECLINIC_FIRESTORE_MODE
  value: production
  availability: 
    - BUILD
    - RUNTIME

- variable: CODECLINIC_FIRESTORE_PROJECT_ID
  value: libconnect-mp4
  availability: 
    - BUILD
    - RUNTIME

- variable: GOOGLE_CLOUD_PROJECT
  value: libconnect-mp4
  availability: 
    - BUILD
    - RUNTIME

# AI gateway (spec workflow/specs/ai-gateway.md R2). The key and base URL are
# Secret Manager secrets (`firebase apphosting:secrets:set ... --project prod`);
# only the model name is a plain value. Runtime only: the build never needs them.
- variable: SOCLAAS_API_KEY
  secret: SOCLAAS_API_KEY
  availability:
    - RUNTIME

- variable: SOCLAAS_BASE_URL
  secret: SOCLAAS_BASE_URL
  availability:
    - RUNTIME

- variable: SOCLAAS_MODEL
  value: qwen3.6:35b
  availability:
    - RUNTIME
